name: PriceDrop CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/price-drop/**'
      - 'shared/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/pricedrop-ci.yml'
      - '.github/workflows/pricedrop-release.yml'
      - '.github/workflows/reusable-validate.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/price-drop/**'
      - 'shared/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/pricedrop-ci.yml'
      - '.github/workflows/pricedrop-release.yml'
      - '.github/workflows/reusable-validate.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

concurrency:
  group: pricedrop-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/reusable-validate.yml
    with:
      changelog_path: apps/price-drop/CHANGELOG.md
      app_root: apps/price-drop
      require_changelog_update: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/price-drop/gradlew

      - name: Build, lint & test
        working-directory: apps/price-drop
        shell: bash
        run: ./gradlew assembleRelease testDebugUnitTest lintRelease ktlintCheck detekt --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricedrop-lint-report-${{ github.run_number }}
          path: apps/price-drop/app/build/reports/lint-results-*.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricedrop-test-results-${{ github.run_number }}
          path: apps/price-drop/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record android/verified commit status
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"android/verified\",\"description\":\"assembleRelease testDebugUnitTest lintRelease ktlintCheck detekt passed\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pricedrop-release-${{ github.sha }}
          path: apps/price-drop/app/build/outputs/apk/release/app-*release*.apk
          if-no-files-found: warn
          retention-days: 14
