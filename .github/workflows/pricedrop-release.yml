name: PriceDrop Release

on:
  workflow_run:
    workflows:
      - PriceDrop CI
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      rebuild_for_tag:
        description: 'Rebuild signed APK for an existing tag (e.g. pricedrop-v1.0.1). Use after fixing SIGNING_* secrets. Skips changelog and version steps.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pricedrop-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Release, and Build APK
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.rebuild_for_tag == '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify release target
        id: release_target
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"

          if [ "$main_sha" = "$head_sha" ]; then
            git checkout -B main "$head_sha"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Main moved ahead. Only mark stale if PriceDrop-relevant files changed
          # after head_sha — a concurrent Scrybe/Shelf Snap version bump pushed to main
          # should not suppress a valid PriceDrop release.
          pricedrop_ahead="$(git log "${head_sha}..origin/main" -- apps/price-drop/CHANGELOG.md apps/price-drop/ shared/ --oneline)"
          if [ -n "$pricedrop_ahead" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release for stale SHA $head_sha — newer PriceDrop commits on main."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Main advanced with non-PriceDrop commits only; rebasing release onto current main."
            git checkout -B main origin/main
          fi

      - name: Check unreleased changelog content
        if: steps.release_target.outputs.stale != 'true'
        id: changelog_ready
        shell: bash
        run: |
          set -euo pipefail
          has_bullets="$(python3 scripts/manage-changelog.py has-unreleased-bullets --changelog apps/price-drop/CHANGELOG.md)"

          # Guard against duplicate releases: if all bullets were already
          # present at the last PriceDrop tag, treat the release as already done.
          if [ "$has_bullets" = "true" ]; then
            latest_tag="$(git tag -l 'pricedrop-v*' --sort=-v:refname | head -1)"
            if [ -n "$latest_tag" ]; then
              has_bullets="$(python3 scripts/manage-changelog.py \
                has-new-unreleased-since-tag \
                --changelog apps/price-drop/CHANGELOG.md \
                --tag "$latest_tag" \
                --fallback-changelog apps/price-drop/CHANGELOG.md)"
            fi
          fi

          echo "has_bullets=$has_bullets" >> "$GITHUB_OUTPUT"
          if [ "$has_bullets" != "true" ]; then
            echo "Skipping release — no new unreleased bullets in apps/price-drop/CHANGELOG.md since the last tag."
          fi

      # Computes the next semantic version from conventional commits since the
      # last pricedrop tag. Version bumping rules:
      #   feat:           → minor bump
      #   fix:, chore:, etc. → patch bump (default_bump)
      #   BREAKING CHANGE → major bump
      - name: Compute next version
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true'
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: pricedrop-v
          dry_run: true

      # Validate the keystore secret BEFORE any irreversible state is created
      # (changelog promotion, version commit, tag push). A bad base64 value
      # here aborts the workflow cleanly with no orphaned tags or commits.
      - name: Validate keystore secret
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > /dev/null 2>&1; then
              echo "::error::SIGNING_KEYSTORE_BASE64 contains invalid base64."
              echo "::error::Re-encode your keystore: base64 -w0 release.keystore (Linux) or base64 release.keystore | tr -d '\\n' (macOS)"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        run: chmod +x apps/price-drop/gradlew

      - name: Promote changelog release section
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          release_notes_path="${{ runner.temp }}/release-notes.md"
          python3 scripts/manage-changelog.py \
            promote-release \
            --changelog apps/price-drop/CHANGELOG.md \
            --version "${{ steps.version.outputs.new_version }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --release-notes-output "$release_notes_path"
          echo "release_notes_path=$release_notes_path" >> "$GITHUB_OUTPUT"

      # versionCode: major * 1,000,000 + minor * 1,000 + patch (matches Scrybe/Shelf Snap convention).
      # Tagged [skip ci] to prevent the push from re-triggering this workflow.
      - name: Bump app version in build.gradle.kts
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          version_name="${{ steps.version.outputs.new_version }}"
          IFS='.' read -r major minor patch <<< "$version_name"
          version_code="$((major * 1000000 + minor * 1000 + patch))"
          build_file="apps/price-drop/app/build.gradle.kts"

          sed -Ei "s/versionName = \"[^\"]*\"/versionName = \"${version_name}\"/" "$build_file"
          sed -Ei "s/versionCode = [0-9]+/versionCode = ${version_code}/" "$build_file"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$build_file" apps/price-drop/CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): pricedrop-${{ steps.version.outputs.new_tag }} [skip ci]"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }

      - name: Create release tag
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      # If all four SIGNING_* secrets are configured, the release APK is signed
      # with that keystore. Otherwise a one-off keystore is generated.
      - name: Set up release signing
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS_VAL" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS_VAL" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -alias pricedrop \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -storepass pricedrop_ks_pass \
              -keypass pricedrop_ks_pass \
              -dname "CN=PriceDrop, O=PriceDrop, C=US" -noprompt
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=pricedrop_ks_pass" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=pricedrop" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=pricedrop_ks_pass" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        working-directory: apps/price-drop
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Stage release assets
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        id: asset
        run: |
          src=$(ls apps/price-drop/app/build/outputs/apk/release/app-release*.apk | head -n1)
          dest="${{ steps.version.outputs.new_tag }}.apk"
          cp "$src" "$dest"
          cp apps/price-drop/app/build/outputs/bundle/release/app-release.aab \
             "${{ steps.version.outputs.new_tag }}.aab" || true
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload artifacts
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true' && steps.version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: PriceDrop v${{ steps.version.outputs.new_version }}
          body_path: ${{ steps.changelog.outputs.release_notes_path }}
          files: |
            ${{ steps.asset.outputs.path }}
            ${{ steps.version.outputs.new_tag }}.aab

  # Triggered via workflow_dispatch with rebuild_for_tag set.
  # Use this to build and upload a signed APK for an orphaned tag (one that was
  # created by the release job but whose APK build failed before uploading).
  # Fix SIGNING_KEYSTORE_BASE64 first, then dispatch with the tag name.
  rebuild:
    name: Rebuild APK for Existing Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_for_tag != ''

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.rebuild_for_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/price-drop/gradlew

      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS_VAL" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS_VAL" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -alias pricedrop \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -storepass pricedrop_ks_pass \
              -keypass pricedrop_ks_pass \
              -dname "CN=PriceDrop, O=PriceDrop, C=US" -noprompt
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=pricedrop_ks_pass" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=pricedrop" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=pricedrop_ks_pass" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        working-directory: apps/price-drop
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Stage release assets
        id: asset
        run: |
          src=$(ls apps/price-drop/app/build/outputs/apk/release/app-release*.apk | head -n1)
          dest="${{ inputs.rebuild_for_tag }}.apk"
          cp "$src" "$dest"
          cp apps/price-drop/app/build/outputs/bundle/release/app-release.aab \
             "${{ inputs.rebuild_for_tag }}.aab" || true
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.rebuild_for_tag }}
          files: |
            ${{ steps.asset.outputs.path }}
            ${{ inputs.rebuild_for_tag }}.aab
