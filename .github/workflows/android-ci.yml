name: Android CI

on:
  push:
    branches: [ "main", "copilot/**" ]
    paths:
      - 'CHANGELOG.md'
      - 'apps/android-whispering/**'
      - 'Dockerfile.dev'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CHANGELOG.md'
      - 'apps/android-whispering/**'
      - 'Dockerfile.dev'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release.yml'

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog structure
        run: python3 apps/android-whispering/scripts/manage-changelog.py validate --changelog CHANGELOG.md

      - name: Require changelog update for main-bound changes
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${{ github.sha }}"
          fi

          python3 apps/android-whispering/scripts/manage-changelog.py \
            check-updated \
            --base-ref "$base_ref" \
            --head-ref "$head_ref" \
            --changelog CHANGELOG.md

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    needs: changelog
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AndroidManifest.xml files
        run: python3 apps/android-whispering/scripts/validate-manifests.py

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changelog, validate]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-whispering/gradlew

      - name: Build debug and release APKs
        working-directory: apps/android-whispering
        shell: bash
        run: bash scripts/ci-gradle-retry.sh assembleDebug assembleRelease

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changelog, validate]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-whispering/gradlew

      - name: Run Android Lint
        working-directory: apps/android-whispering
        shell: bash
        run: bash scripts/ci-gradle-retry.sh lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changelog, validate]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-whispering/gradlew

      - name: Run Unit Tests
        working-directory: apps/android-whispering
        shell: bash
        run: bash scripts/ci-gradle-retry.sh testDebugUnitTest
