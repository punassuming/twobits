name: Android CI

on:
  push:
    branches: [ "main", "copilot/**", "claude/**" ]
    paths:
      - 'CHANGELOG.md'
      - 'apps/scrybe/**'
      - 'shared/**'
      - 'Dockerfile.dev'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CHANGELOG.md'
      - 'apps/scrybe/**'
      - 'shared/**'
      - 'Dockerfile.dev'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog structure
        run: python3 apps/scrybe/scripts/manage-changelog.py validate --changelog CHANGELOG.md

      - name: Require changelog update for main-bound changes
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${{ github.sha }}"
          fi

          python3 apps/scrybe/scripts/manage-changelog.py \
            check-updated \
            --base-ref "$base_ref" \
            --head-ref "$head_ref" \
            --changelog CHANGELOG.md

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    needs: changelog
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AndroidManifest.xml files
        run: python3 apps/scrybe/scripts/validate-manifests.py --root apps/scrybe

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      statuses: write
    outputs:
      skip_android: ${{ steps.check.outputs.skip_android }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this push is version-only
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          current="${{ github.sha }}"
          repo="${{ github.repository }}"
          zero_sha="0000000000000000000000000000000000000000"

          echo "skip_android=false" >> "$GITHUB_OUTPUT"

          if [ "$before" = "$zero_sha" ]; then
            echo "First push on this branch; no parent to inherit status from."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$before" "$current")
          echo "Changed files (${#changed[@]}):"; printf '  %s\n' "${changed[@]}"

          if [ "${#changed[@]}" -eq 0 ]; then exit 0; fi

          allowed=("CHANGELOG.md" "apps/scrybe/app/build.gradle.kts")
          version_only=true
          for f in "${changed[@]}"; do
            matched=false
            for a in "${allowed[@]}"; do [ "$f" = "$a" ] && matched=true && break; done
            if [ "$matched" = "false" ]; then
              echo "Non-version file changed: $f — running full verify."
              version_only=false; break
            fi
          done

          [ "$version_only" = "false" ] && exit 0

          parent_state="$(curl -sSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/commits/${before}/statuses" \
            2>/dev/null | python3 -c "import json, sys; data = json.load(sys.stdin); print(next((s.get('state', 'none') for s in data if isinstance(s, dict) and s.get('context') == 'android/verified'), 'none'))" 2>/dev/null)" || parent_state="none"

          echo "Parent android/verified state: $parent_state"
          [ "$parent_state" != "success" ] && exit 0

          curl -sSL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/statuses/${current}" \
            -d "{\"state\":\"success\",\"context\":\"android/verified\",\"description\":\"Inherited from ${before} (version-only change)\",\"target_url\":\"https://github.com/${repo}/actions\"}" \
            > /dev/null || echo "::warning::Could not propagate android/verified status (non-fatal)"

          echo "skip_android=true" >> "$GITHUB_OUTPUT"

  verify-android:
    name: Verify Android
    runs-on: ubuntu-latest
    needs: [changelog, validate, detect-changes]
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 45
    if: >-
      always() &&
      needs.changelog.result == 'success' &&
      needs.validate.result == 'success' &&
      (needs['detect-changes'].result == 'success' || needs['detect-changes'].result == 'skipped') &&
      needs['detect-changes'].outputs.skip_android != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/scrybe/gradlew

      # Run all Android verification in one Gradle invocation so the runner
      # reuses a single environment setup, configuration phase, and dependency
      # resolution pass instead of paying for three separate build cycles.
      - name: Run Android verification
        working-directory: apps/scrybe
        shell: bash
        run: bash scripts/ci-gradle-retry.sh assembleDebug testDebugUnitTest lint ktlintCheck detekt

      - name: Upload Scrybe debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scrybe-debug-${{ github.sha }}
          path: apps/scrybe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Record android/verified commit status
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"android/verified\",\"description\":\"assembleDebug, tests, lint, ktlint, detekt all passed\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
