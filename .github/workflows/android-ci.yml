name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'CHANGELOG.md'
      - 'apps/android-whispering/**'
      - 'Dockerfile.dev'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CHANGELOG.md'
      - 'apps/android-whispering/**'
      - 'Dockerfile.dev'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog structure
        run: python3 apps/android-whispering/scripts/manage-changelog.py validate --changelog CHANGELOG.md

      - name: Require changelog update for main-bound changes
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${{ github.sha }}"
          fi

          python3 apps/android-whispering/scripts/manage-changelog.py \
            check-updated \
            --base-ref "$base_ref" \
            --head-ref "$head_ref" \
            --changelog CHANGELOG.md

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    needs: changelog
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AndroidManifest.xml files
        run: python3 apps/android-whispering/scripts/validate-manifests.py

  verify-android:
    name: Verify Android
    runs-on: ubuntu-latest
    needs: [changelog, validate]
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-whispering/gradlew

      # Run all Android verification in one Gradle invocation so the runner
      # reuses a single environment setup, configuration phase, and dependency
      # resolution pass instead of paying for three separate build cycles.
      - name: Run Android verification
        working-directory: apps/android-whispering
        shell: bash
        run: bash scripts/ci-gradle-retry.sh assembleDebug testDebugUnitTest lint ktlintCheck detekt
