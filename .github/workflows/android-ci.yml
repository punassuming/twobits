name: Android CI

on:
  push:
    branches: [ "main", "copilot/**" ]
    paths:
      - 'apps/android-whispering/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/android-whispering/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-whispering/gradlew

      - name: Build debug APK
        working-directory: apps/android-whispering
        run: ./gradlew assembleDebug --no-daemon

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-whispering/gradlew

      - name: Run Android Lint
        working-directory: apps/android-whispering
        run: ./gradlew lint --no-daemon

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-whispering/gradlew

      - name: Run Unit Tests
        working-directory: apps/android-whispering
        run: ./gradlew testDebugUnitTest --no-daemon
