name: Scrybe Release

on:
  workflow_run:
    workflows:
      - Scrybe CI
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      rebuild_for_tag:
        description: 'Rebuild signed APK for an existing tag (e.g. scrybe-v1.6.1). Use after fixing SIGNING_* secrets. Skips changelog and version steps.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scrybe-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Release, and Build APK
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.rebuild_for_tag == '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/reusable-release.yml
    with:
      app_name: Scrybe
      app_root: apps/scrybe
      tag_prefix: scrybe-v
      default_bump: patch
      keystore_alias: scrybe
      keystore_storepass: scrybe_ks_pass
      use_retry_script: true
      head_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      rebuild_for_tag: ''
    secrets: inherit

  rebuild:
    name: Rebuild APK for Existing Tag
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_for_tag != ''
    uses: ./.github/workflows/reusable-release.yml
    with:
      app_name: Scrybe
      app_root: apps/scrybe
      tag_prefix: scrybe-v
      keystore_alias: scrybe
      keystore_storepass: scrybe_ks_pass
      use_retry_script: true
      rebuild_for_tag: ${{ inputs.rebuild_for_tag }}
    secrets: inherit
