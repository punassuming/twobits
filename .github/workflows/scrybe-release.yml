name: Scrybe Release

on:
  workflow_run:
    workflows:
      - Scrybe CI
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      rebuild_for_tag:
        description: 'Rebuild signed APK for an existing tag (e.g. scrybe-v1.6.1). Use after fixing SIGNING_* secrets. Skips changelog and version steps.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scrybe-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Release, and Build APK
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.rebuild_for_tag == '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify release target
        id: release_target
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"

          if [ "$main_sha" = "$head_sha" ]; then
            git checkout -B main "$head_sha"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Main moved ahead. Only mark stale if Scrybe-relevant files changed
          # after head_sha — a concurrent shelf-snap version bump pushed to main
          # should not suppress a valid Scrybe release.
          scrybe_ahead="$(git log "${head_sha}..origin/main" -- apps/scrybe/CHANGELOG.md apps/scrybe/ shared/ --oneline)"
          if [ -n "$scrybe_ahead" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release for stale SHA $head_sha — newer Scrybe commits on main."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Main advanced with non-Scrybe commits only; rebasing release onto current main."
            git checkout -B main origin/main
          fi

      - name: Check unreleased changelog content
        if: steps.release_target.outputs.stale != 'true'
        id: changelog_ready
        shell: bash
        run: |
          set -euo pipefail

          has_bullets="$(python3 scripts/manage-changelog.py has-unreleased-bullets --changelog apps/scrybe/CHANGELOG.md)"

          # Guard against duplicate releases: if all bullets were already
          # present at the last Scrybe tag (e.g. a rebase preserved stale
          # ## Unreleased content), treat the release as already done.
          if [ "$has_bullets" = "true" ]; then
            latest_tag="$(git tag -l 'scrybe-v*' --sort=-v:refname | head -1)"
            if [ -n "$latest_tag" ]; then
              has_bullets="$(python3 scripts/manage-changelog.py \
                has-new-unreleased-since-tag \
                --changelog apps/scrybe/CHANGELOG.md \
                --tag "$latest_tag" \
                --fallback-changelog CHANGELOG.md)"
            fi
          fi

          echo "has_bullets=$has_bullets" >> "$GITHUB_OUTPUT"

          if [ "$has_bullets" != "true" ]; then
            echo "Skipping release because apps/scrybe/CHANGELOG.md has no new unreleased bullets since the last tag."
          fi

      # Computes the next semantic version from conventional commits since the
      # last tag without creating the tag yet. Version bumping rules:
      #   feat:           → minor bump
      #   fix:, chore:, etc. → patch bump (default_bump)
      #   BREAKING CHANGE → major bump
      - name: Compute next version
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true'
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          tag_prefix: scrybe-v
          dry_run: true

      # Validate the keystore secret BEFORE any irreversible state is created
      # (changelog promotion, version commit, tag push). A bad base64 value
      # here aborts the workflow cleanly with no orphaned tags or commits.
      - name: Validate keystore secret
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > /dev/null 2>&1; then
              echo "::error::SIGNING_KEYSTORE_BASE64 contains invalid base64."
              echo "::error::Re-encode your keystore: base64 -w0 release.keystore (Linux) or base64 release.keystore | tr -d '\\n' (macOS)"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        run: chmod +x apps/scrybe/gradlew

      - name: Promote changelog release section
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          release_notes_path="${{ runner.temp }}/release-notes.md"
          python3 scripts/manage-changelog.py \
            promote-release \
            --changelog apps/scrybe/CHANGELOG.md \
            --version "${{ steps.version.outputs.new_version }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --release-notes-output "$release_notes_path"

          echo "release_notes_path=$release_notes_path" >> "$GITHUB_OUTPUT"

      # Updates app version metadata so the repository always reflects the
      # latest released version. versionCode is derived from semantic versioning
      # as major * 1,000,000 + minor * 1,000 + patch (monotonic for Android installs).
      # Tagged [skip ci] to prevent the push from re-triggering this workflow.
      - name: Bump app version in build.gradle.kts
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          version_name="${{ steps.version.outputs.new_version }}"
          IFS='.' read -r major minor patch <<< "$version_name"
          version_code="$((major * 1000000 + minor * 1000 + patch))"
          build_file="apps/scrybe/app/build.gradle.kts"

          sed -Ei "s/versionCode = [0-9]+/versionCode = ${version_code}/" "$build_file"
          sed -Ei "s/versionName = \"[^\"]*\"/versionName = \"${version_name}\"/" "$build_file"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase --autostash origin/main
          git add "$build_file" apps/scrybe/CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: prepare release ${version_name} (${version_code}) [skip ci]"
          git push origin HEAD:main

      - name: Create release tag
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Set up release signing
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS_VAL" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/scrybe-release.jks"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_VAL" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "${{ runner.temp }}/scrybe-release.jks" \
              -alias scrybe \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -storepass scrybe_ks_pass \
              -keypass scrybe_ks_pass \
              -dname "CN=Scrybe, O=Scrybe, C=US" -noprompt
            echo "STORE_PASSWORD=scrybe_ks_pass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=scrybe" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=scrybe_ks_pass" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${{ runner.temp }}/scrybe-release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Validate release signing inputs
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          keytool -importkeystore \
            -srckeystore "$KEYSTORE_PATH" \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "${{ runner.temp }}/keystore-validation.p12" \
            -deststoretype PKCS12 \
            -deststorepass validate_pass \
            -destkeypass validate_pass \
            -noprompt \
            >/dev/null

          rm -f "${{ runner.temp }}/keystore-validation.p12"

      - name: Build release APK and AAB
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        working-directory: apps/scrybe
        shell: bash
        run: bash ../../scripts/ci-gradle-retry.sh assembleRelease bundleRelease

      - name: Stage release assets
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        id: asset
        run: |
          src=$(ls apps/scrybe/app/build/outputs/apk/release/app-*release.apk | head -n1)
          dest="${{ steps.version.outputs.new_tag }}.apk"
          cp "$src" "$dest"
          src_aab=apps/scrybe/app/build/outputs/bundle/release/app-release.aab
          [ -f "$src_aab" ] && cp "$src_aab" "${{ steps.version.outputs.new_tag }}.aab" || true
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload artifacts
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Scrybe v${{ steps.version.outputs.new_version }}
          body_path: ${{ steps.changelog.outputs.release_notes_path }}
          files: |
            ${{ steps.asset.outputs.path }}
            ${{ steps.version.outputs.new_tag }}.aab

      - name: Sync to origin/main
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        run: |
          git fetch origin main
          git reset --hard origin/main

  # Triggered via workflow_dispatch with rebuild_for_tag set.
  # Use this to build and upload a signed APK for an orphaned tag (one that was
  # created by the release job but whose APK build failed before uploading).
  # Fix SIGNING_KEYSTORE_BASE64 first, then dispatch with the tag name.
  rebuild:
    name: Rebuild APK for Existing Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_for_tag != ''

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.rebuild_for_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/scrybe/gradlew

      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS_VAL" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/scrybe-release.jks"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_VAL" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "${{ runner.temp }}/scrybe-release.jks" \
              -alias scrybe \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -storepass scrybe_ks_pass \
              -keypass scrybe_ks_pass \
              -dname "CN=Scrybe, O=Scrybe, C=US" -noprompt
            echo "STORE_PASSWORD=scrybe_ks_pass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=scrybe" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=scrybe_ks_pass" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${{ runner.temp }}/scrybe-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: apps/scrybe
        shell: bash
        run: bash ../../scripts/ci-gradle-retry.sh assembleRelease bundleRelease

      - name: Stage release assets
        id: asset
        run: |
          src=$(ls apps/scrybe/app/build/outputs/apk/release/app-*release.apk | head -n1)
          dest="${{ inputs.rebuild_for_tag }}.apk"
          cp "$src" "$dest"
          src_aab=apps/scrybe/app/build/outputs/bundle/release/app-release.aab
          [ -f "$src_aab" ] && cp "$src_aab" "${{ inputs.rebuild_for_tag }}.aab" || true
          echo "path=$dest" >> "$GITHUB_OUTPUT"

