name: Reusable App Build

# Shared Android build job used by all three app CI workflows.
# Runs assembleRelease + tests + lint + ktlint + detekt in a single Gradle invocation.
on:
  workflow_call:
    inputs:
      app_root:
        description: 'App root directory relative to repo root (e.g. apps/scrybe)'
        type: string
        required: true
      app_name:
        description: 'Short app name used for artifact labels (e.g. scrybe)'
        type: string
        required: true
      gradle_tasks:
        description: 'Space-separated Gradle tasks to run'
        type: string
        required: false
        default: 'assembleRelease testDebugUnitTest lintRelease ktlintCheck detekt'
      use_retry_script:
        description: 'Invoke scripts/ci-gradle-retry.sh instead of ./gradlew (for Scrybe)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ inputs.app_root }}/gradlew

      - name: Build, lint & test
        working-directory: ${{ inputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.use_retry_script }}" = "true" ]; then
            bash ../../scripts/ci-gradle-retry.sh ${{ inputs.gradle_tasks }}
          else
            ./gradlew ${{ inputs.gradle_tasks }} --no-daemon
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-lint-report-${{ github.run_number }}
          path: ${{ inputs.app_root }}/app/build/reports/lint-results-*.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-test-results-${{ github.run_number }}
          path: ${{ inputs.app_root }}/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record android/verified commit status
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"android/verified\",\"description\":\"${{ inputs.gradle_tasks }} passed\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-release-${{ github.sha }}
          path: ${{ inputs.app_root }}/app/build/outputs/apk/release/app-*release*.apk
          if-no-files-found: warn
          retention-days: 14
