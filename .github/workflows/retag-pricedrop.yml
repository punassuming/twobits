name: Retag PriceDrop (one-shot)
on:
  workflow_dispatch:

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (bare — just need git)
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/punassuming/twobits.git
          git fetch --tags

      - name: Delete bad pricedrop-v0.0.1 tag
        run: git push origin :refs/tags/pricedrop-v0.0.1 || echo "Tag did not exist, continuing"

      - name: Create correct pricedrop-v0.5.0 tag
        run: |
          git tag pricedrop-v0.5.0 208ccdacd373343a9fa77f403378364a29585f92
          git push origin pricedrop-v0.5.0
