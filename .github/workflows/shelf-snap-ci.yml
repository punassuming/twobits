name: Shelf Snap CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/shelf-snap/**'
      - 'shared/**'
      - '.github/workflows/shelf-snap-ci.yml'
      - '.github/workflows/shelf-snap-release.yml'
      - '.github/workflows/reusable-validate.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/shelf-snap/**'
      - 'shared/**'
      - '.github/workflows/shelf-snap-ci.yml'
      - '.github/workflows/shelf-snap-release.yml'
      - '.github/workflows/reusable-validate.yml'
  workflow_dispatch:

concurrency:
  group: shelf-snap-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/reusable-validate.yml
    with:
      changelog_path: apps/shelf-snap/CHANGELOG.md
      app_root: apps/shelf-snap
      require_changelog_update: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/shelf-snap/gradlew

      # Single Gradle invocation matching the scrybe-ci pattern.
      - name: Build, lint & test
        working-directory: apps/shelf-snap
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-snap-lint-report-${{ github.run_number }}
          path: apps/shelf-snap/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-snap-test-results-${{ github.run_number }}
          path: apps/shelf-snap/app/build/reports/tests/
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-snap-debug-${{ github.sha }}
          path: apps/shelf-snap/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
