name: Shelf Snap CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/shelf-snap/**'
      - 'shared/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/shelf-snap-ci.yml'
      - '.github/workflows/shelf-snap-release.yml'
      - '.github/workflows/reusable-validate.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/shelf-snap/**'
      - 'shared/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/shelf-snap-ci.yml'
      - '.github/workflows/shelf-snap-release.yml'
      - '.github/workflows/reusable-validate.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

concurrency:
  group: shelf-snap-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/reusable-validate.yml
    with:
      changelog_path: apps/shelf-snap/CHANGELOG.md
      app_root: apps/shelf-snap
      require_changelog_update: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  build:
    name: Build & Verify
    needs: validate
    uses: ./.github/workflows/reusable-build.yml
    with:
      app_root: apps/shelf-snap
      app_name: shelf-snap
      gradle_tasks: assembleRelease testDebugUnitTest lintRelease ktlintCheck detekt
    secrets: inherit
