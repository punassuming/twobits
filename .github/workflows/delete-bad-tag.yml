name: Delete bad pricedrop-v0.0.1 tag (one-shot)
on:
  workflow_dispatch:

jobs:
  delete-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pricedrop-v0.0.1 tag
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/punassuming/twobits.git
          git push origin :refs/tags/pricedrop-v0.0.1 || echo "Tag did not exist, nothing to do"
