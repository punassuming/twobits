name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Tag, Release, and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Computes the next semantic version from conventional commits since the
      # last tag, creates the git tag, and outputs the changelog fragment.
      # Version bumping rules:
      #   feat:       → minor bump
      #   fix:, chore:, etc. → patch bump (default_bump)
      #   BREAKING CHANGE    → major bump
      - name: Compute next version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Set up JDK 17
        if: steps.tag.outputs.new_tag != ''
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        if: steps.tag.outputs.new_tag != ''
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.tag.outputs.new_tag != ''
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        if: steps.tag.outputs.new_tag != ''
        run: chmod +x apps/android-whispering/gradlew

      # Updates versionName in source so the repository always reflects the
      # latest released version. The commit is tagged [skip ci] to prevent
      # the push from re-triggering this workflow.
      - name: Bump versionName in build.gradle.kts
        if: steps.tag.outputs.new_tag != ''
        run: |
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.tag.outputs.new_version }}\"/" \
            apps/android-whispering/app/build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/android-whispering/app/build.gradle.kts
          git diff --staged --quiet || git commit -m "chore: bump versionName to ${{ steps.tag.outputs.new_version }} [skip ci]"
          git push

      # Sets up APK signing. If KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and
      # KEY_PASSWORD secrets are all configured in the repository, the release
      # APK is signed with that keystore. If any of the four secrets is absent,
      # a one-off keystore is generated so the APK is still signed and
      # installable (users must uninstall before upgrading when no persistent
      # keystore secret is used).
      - name: Set up release signing
        if: steps.tag.outputs.new_tag != ''
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS_VAL" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/scrybe-release.jks"
          else
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "${{ runner.temp }}/scrybe-release.jks" \
              -alias scrybe \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -storepass scrybe_ks_pass \
              -keypass scrybe_key_pass \
              -dname "CN=Scrybe, O=Scrybe, C=US" -noprompt
          fi
          echo "KEYSTORE_PATH=${{ runner.temp }}/scrybe-release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        if: steps.tag.outputs.new_tag != ''
        working-directory: apps/android-whispering
        run: ./gradlew assembleRelease --no-daemon
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'scrybe_ks_pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'scrybe' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'scrybe_key_pass' }}

      - name: Create GitHub Release and upload APK
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: apps/android-whispering/app/build/outputs/apk/release/*.apk
