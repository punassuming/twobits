name: Release

on:
  workflow_run:
    workflows:
      - Android CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Release, and Build APK
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release target
        id: release_target
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${{ github.event.workflow_run.head_sha }}"
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"

          if [ "$main_sha" != "$head_sha" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release for stale SHA $head_sha because origin/main is now $main_sha."
            exit 0
          fi

          git checkout -B main "$head_sha"
          echo "stale=false" >> "$GITHUB_OUTPUT"

      # Computes the next semantic version from conventional commits since the
      # last tag without creating the tag yet. The tag is created after the
      # changelog and app version commit so release tags point at the exact
      # source used to build the uploaded APK.
      # Version bumping rules:
      #   feat:       → minor bump
      #   fix:, chore:, etc. → patch bump (default_bump)
      #   BREAKING CHANGE    → major bump
      - name: Check unreleased changelog content
        if: steps.release_target.outputs.stale != 'true'
        id: changelog_ready
        shell: bash
        run: |
          set -euo pipefail

          has_bullets="$(python3 apps/android-whispering/scripts/manage-changelog.py has-unreleased-bullets --changelog CHANGELOG.md)"
          echo "has_bullets=$has_bullets" >> "$GITHUB_OUTPUT"

          if [ "$has_bullets" != "true" ]; then
            echo "Skipping release because CHANGELOG.md has no unreleased bullets."
          fi

      - name: Compute next version
        if: steps.release_target.outputs.stale != 'true' && steps.changelog_ready.outputs.has_bullets == 'true'
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          dry_run: true

      - name: Set up JDK 17
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        run: chmod +x apps/android-whispering/gradlew

      - name: Promote changelog release section
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          release_notes_path="${{ runner.temp }}/release-notes.md"
          python3 apps/android-whispering/scripts/manage-changelog.py \
            promote-release \
            --changelog CHANGELOG.md \
            --version "${{ steps.version.outputs.new_version }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --release-notes-output "$release_notes_path"

          echo "release_notes_path=$release_notes_path" >> "$GITHUB_OUTPUT"

      # Updates app version metadata in source so the repository always reflects
      # the latest released version. versionCode is derived from semantic
      # versioning as major * 1,000,000 + minor * 1,000 + patch, which keeps it
      # monotonic for Android installs and tied directly to the release tag.
      # The commit is tagged [skip ci] to prevent the push from re-triggering
      # this workflow.
      - name: Bump app version in build.gradle.kts
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          version_name="${{ steps.version.outputs.new_version }}"
          IFS='.' read -r major minor patch <<< "$version_name"
          version_code="$((major * 1000000 + minor * 1000 + patch))"
          build_file="apps/android-whispering/app/build.gradle.kts"

          sed -Ei "s/versionCode = [0-9]+/versionCode = ${version_code}/" "$build_file"
          sed -Ei "s/versionName = \"[^\"]*\"/versionName = \"${version_name}\"/" "$build_file"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$build_file" CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: prepare release ${version_name} (${version_code}) [skip ci]"
          git push origin HEAD:main

      - name: Create release tag
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      # Sets up APK signing. If KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and
      # KEY_PASSWORD secrets are all configured in the repository, the release
      # APK is signed with that keystore. If any of the four secrets is absent,
      # a one-off keystore is generated so the APK is still signed and
      # installable (users must uninstall before upgrading when no persistent
      # keystore secret is used).
      #
      # All four signing variables (KEYSTORE_PATH, STORE_PASSWORD, KEY_ALIAS,
      # KEY_PASSWORD) are written to GITHUB_ENV so the subsequent build step
      # uses the exact same credentials that were used to set up the keystore —
      # preventing a password mismatch when only a subset of secrets is set.
      - name: Set up release signing
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS_VAL" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/scrybe-release.jks"
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_VAL" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            # PKCS12 keystores (Java 9+) normalise the key password to the store
            # password, so both values must be identical to avoid a decryption
            # error when the AGP reads back the key entry.
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "${{ runner.temp }}/scrybe-release.jks" \
              -alias scrybe \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -storepass scrybe_ks_pass \
              -keypass scrybe_ks_pass \
              -dname "CN=Scrybe, O=Scrybe, C=US" -noprompt
            echo "STORE_PASSWORD=scrybe_ks_pass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=scrybe" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=scrybe_ks_pass" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${{ runner.temp }}/scrybe-release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}

      # Fail fast on bad keystore secrets instead of spending several minutes
      # compiling before APK packaging hits the signing error.
      - name: Validate release signing inputs
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          keytool -importkeystore \
            -srckeystore "$KEYSTORE_PATH" \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "${{ runner.temp }}/keystore-validation.p12" \
            -deststoretype PKCS12 \
            -deststorepass validate_pass \
            -destkeypass validate_pass \
            -noprompt \
            >/dev/null

          rm -f "${{ runner.temp }}/keystore-validation.p12"

      # Normal Android CI now validates compile, unit tests, lint, ktlint, and
      # detekt through a single debug-focused verification job. The release
      # workflow remains the only place that assembles the signed release APK.
      - name: Build release APK
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        working-directory: apps/android-whispering
        shell: bash
        run: bash scripts/ci-gradle-retry.sh assembleRelease
        # KEYSTORE_PATH, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD are set in
        # GITHUB_ENV by the "Set up release signing" step above, ensuring the
        # build always uses the same credentials that were used to configure the
        # keystore (real secrets or fallback defaults).

      - name: Create GitHub Release and upload APK
        if: steps.release_target.outputs.stale != 'true' && steps.version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body_path: ${{ steps.changelog.outputs.release_notes_path }}
          files: apps/android-whispering/app/build/outputs/apk/release/*.apk
