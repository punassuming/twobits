name: Shelf Snap Build

on:
  push:
    branches: [ "main", "copilot/**", "claude/**" ]
    paths:
      - 'apps/shelf-snap/**'
      - 'shared/**'
      - '.github/workflows/shelf-snap-build.yml'
      - '.github/workflows/shelf-snap-release.yml'
      - '.github/workflows/shelf-snap-tag-release.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/shelf-snap/**'
      - 'shared/**'
      - '.github/workflows/shelf-snap-build.yml'
      - '.github/workflows/shelf-snap-release.yml'
      - '.github/workflows/shelf-snap-tag-release.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog structure
        run: python3 apps/scrybe/scripts/manage-changelog.py validate --changelog apps/shelf-snap/CHANGELOG.md

      - name: Require changelog update for main-bound changes
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${{ github.sha }}"
          fi

          python3 apps/scrybe/scripts/manage-changelog.py \
            check-updated \
            --base-ref "$base_ref" \
            --head-ref "$head_ref" \
            --changelog apps/shelf-snap/CHANGELOG.md

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    needs: changelog
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AndroidManifest.xml files
        run: python3 apps/scrybe/scripts/validate-manifests.py --root apps/shelf-snap

  build:
    name: Lint, test & build debug APK
    runs-on: ubuntu-latest
    needs: [changelog, validate]
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/shelf-snap/gradlew

      # Single Gradle invocation: lint + tests + debug build share one configuration
      # phase and dependency resolution pass, matching the scrybe android-ci.yml pattern.
      # Release APK/AAB are only built by shelf-snap-tag-release.yml on main pushes.
      - name: Build, lint & test
        working-directory: apps/shelf-snap
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-snap-lint-report-${{ github.run_number }}
          path: apps/shelf-snap/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-snap-test-results-${{ github.run_number }}
          path: apps/shelf-snap/app/build/reports/tests/
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shelf-snap-debug-${{ github.sha }}
          path: apps/shelf-snap/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
