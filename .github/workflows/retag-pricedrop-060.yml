name: Retag PriceDrop 0.6.0 (one-shot)

# One-shot maintenance workflow. The automated release mis-stamped the
# 2026-06-25 PriceDrop release as pricedrop-v0.0.1 (a tag-fetch race made
# github-tag-action fall back to 0.0.0 → 0.0.1). This corrects the tags:
#   * pricedrop-v0.6.0 → the commit that actually shipped the 0.6.0 content
#   * pricedrop-v0.0.1 → restored to the genuine original first-release commit
# Delete this file after a successful run.
on:
  workflow_dispatch:

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (bare — just need git)
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/punassuming/twobits.git
          git fetch --tags origin

      - name: Create correct pricedrop-v0.6.0 tag
        run: |
          git tag -f pricedrop-v0.6.0 452c013ca2d49539c778c5212b8d7893f986d5ba
          git push -f origin pricedrop-v0.6.0

      - name: Restore pricedrop-v0.0.1 to original first-release commit
        run: |
          git tag -f pricedrop-v0.0.1 87ea540
          git push -f origin pricedrop-v0.0.1
