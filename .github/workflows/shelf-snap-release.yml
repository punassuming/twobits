name: Shelf Snap Publish Release APK

# Publishes the Shelf Snap release APK as a GitHub Release asset.
#  - Push a version tag (e.g. shelf-snap-v1.0, shelf-snap-v1.2.3) for an
#    official, versioned release.
#  - Or trigger manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - "shelf-snap-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. shelf-snap-v1.0.1)"
        required: true
        default: "shelf-snap-v1.0.0"
      prerelease:
        description: "Mark this release as a pre-release"
        type: boolean
        required: false
        default: false

concurrency:
  group: shelf-snap-release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x apps/shelf-snap/gradlew

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        working-directory: apps/shelf-snap
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Stage release assets
        id: asset
        run: |
          src=$(ls apps/shelf-snap/app/build/outputs/apk/release/app-release*.apk | head -n1)
          dest="shelf-snap-${{ steps.meta.outputs.tag }}.apk"
          cp "$src" "$dest"
          echo "Packaged release asset: $dest (from $src)"
          if [[ "$src" == *unsigned* ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          cp apps/shelf-snap/app/build/outputs/bundle/release/app-release.aab \
             "shelf-snap-${{ steps.meta.outputs.tag }}.aab" || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Shelf Snap ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ steps.asset.outputs.path }}
            shelf-snap-${{ steps.meta.outputs.tag }}.aab
          body: |
            ### Shelf Snap ${{ steps.meta.outputs.tag }}

            Download **`${{ steps.asset.outputs.path }}`** below to sideload on
            Android (API 26+), or use the `.aab` bundle to publish to Google Play.

            ```bash
            adb install ${{ steps.asset.outputs.path }}
            ```

            > APK signing: **${{ steps.asset.outputs.signed == 'true' && 'signed with the release keystore' || 'debug-signed (release signing secrets not configured)' }}**.
