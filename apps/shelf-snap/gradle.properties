# MaxMetaspaceSize raised from 1024m: AGP 9's bundled R8 (9.4.24) exhausted the old
# cap during minifyReleaseWithR8 ("R8: java.lang.OutOfMemoryError: Metaspace"),
# something the AGP 8-era R8 never hit here.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.4.0 was validated against compileSdk 34; we intentionally compile against 35.
# Suppress the unsupported-compileSdk warning so it can't noise/escalate the build.
android.suppressUnsupportedCompileSdk=35
# AGP 9 enables built-in Kotlin support by default, which bundles its own Kotlin
# compiler (2.2.0) independent of the "kotlin" version in gradle/libs.versions.toml.
# litertlm-android ships Kotlin metadata that only a 2.3.0+ compiler can read (see the
# comment on the "kotlin" catalog entry), so built-in Kotlin's older bundled compiler
# breaks the build with "compiled with an incompatible version of Kotlin" errors.
# Opting out keeps the classic org.jetbrains.kotlin.android plugin, pinned to the
# catalog's Kotlin version, in control instead. AGP 9's "new DSL" (on by default) is
# incompatible with that plugin independently of built-in Kotlin, so it needs its own
# opt-out too.
android.builtInKotlin=false
android.newDsl=false
# AGP 9 refuses Provider instances passed to sourceSets.*.srcDir() (used for the
# generated changelog-assets dir in app/build.gradle.kts) unless this is set. The
# ordering that Provider would have inferred is already explicit via this repo's own
# `tasks.named("preBuild").dependsOn(...)`, so nothing is lost by opting back in.
android.sourceset.disallowProvider=false
